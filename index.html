<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>證件A4排版</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="證件A4">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>證件 / 存摺 A4 排版</h1>
  <span id="cvstat" class="pill">引擎載入中…</span>
</header>

<main>
  <section class="card">
    <h2>① 選擇圖片</h2>
    <div id="drop" class="drop">
      <p>把照片拖到這裡，或使用下方按鈕<br><small>一張照片裡有多個證件／存摺會自動分開處理</small></p>
      <div class="row">
        <button id="pick" class="primary">選擇圖片</button>
        <button id="snap">拍照</button>
        <button id="clear" class="danger">清除全部</button>
      </div>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <div id="status" class="status"></div>
  </section>

  <section class="card">
    <h2>② 偵測結果 <small>（勾選要排進 A4 的項目，可旋轉、手動調整框選）</small></h2>
    <div id="list" class="list"><p class="muted">尚未選擇圖片</p></div>
  </section>

  <section class="card">
    <h2>③ 排版與匯出</h2>
    <div class="grid">
      <label>尺寸模式
        <select id="mode">
          <option value="auto">自動放大填滿（不小於實際大小）</option>
          <option value="real">實際大小（證件 85.6×54mm）</option>
        </select>
      </label>
      <label>存摺長邊 (mm)
        <input id="passbookLong" type="number" value="142" min="50" max="290">
      </label>
      <label>其他物件長邊 (mm)
        <input id="otherLong" type="number" value="120" min="30" max="280">
      </label>
      <label>邊距 (mm)
        <input id="margin" type="number" value="10" min="0" max="40">
      </label>
      <label>間距 (mm)
        <input id="gap" type="number" value="5" min="0" max="30">
      </label>
      <label>解析度
        <select id="dpi">
          <option value="150">150 dpi</option>
          <option value="200" selected>200 dpi</option>
          <option value="300">300 dpi（較大）</option>
        </select>
      </label>
      <label class="chk"><input id="rot" type="checkbox" checked> 允許自動旋轉 90° 以排更緊密</label>
      <label class="chk"><input id="border" type="checkbox" checked> 顯示細邊框（方便裁切）</label>
    </div>
    <p class="muted small">預設（自動）：長寬比約 1.4～1.8 視為證件（85.6×54mm），其他視為「其他物件」。<b>存摺不會自動判斷</b>，請在每一件下方的下拉選單手動選「存摺」，才會以存摺長邊（預設 142mm）排列。</p>
    <div class="row">
      <button id="dlJpg" class="primary">下載 JPG</button>
      <button id="dlPng">下載 PNG</button>
      <button id="dlPdf">下載 PDF</button>
      <button id="share">分享／儲存</button>
    </div>
    <div id="pages" class="pages"></div>
  </section>
</main>

<div id="editor" class="editor" hidden>
  <div class="edbox">
    <div class="edhead"><strong id="edtitle">調整框選</strong><small>拖曳圓點調整四角，點框內可切換選取</small></div>
    <div class="edcanvas"><canvas id="edcv"></canvas></div>
    <div class="row">
      <button id="edAdd">＋ 新增框</button>
      <button id="edDel" class="danger">刪除選取框</button>
      <button id="edAuto">自動重新偵測</button>
      <span class="spacer"></span>
      <button id="edCancel">取消</button>
      <button id="edOk" class="primary">完成</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
